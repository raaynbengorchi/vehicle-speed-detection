version: "3.8"

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - VIDEO_FPS=30.0
      - SPEED_LIMIT=60.0
      - LINE1_Y=200.0
      - LINE2_Y=400.0
      - CONFIDENCE_THRESHOLD=0.5
      - MODEL_PATH=yolo11n.pt
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/outputs:/app/outputs
    depends_on:
      - frontend

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=http://backend:8000/api
    depends_on:
      - backend

  # Optional: Add a model volume if using custom YOLO weights
  # model:
  #   image: alpine:latest
  #   volumes:
  #     - ./models:/app/models